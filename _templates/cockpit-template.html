<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Client Program Cockpit</title>
<!--
  ============================================================================
  VNTANA CLIENT PROGRAM COCKPIT  —  reusable template
  ----------------------------------------------------------------------------
  Spin up a new client review page in ~10 minutes:
    1. Copy this file to  /<client>-review/index.html  (or /<client>.html).
    2. Edit ONLY the CONFIG object at the bottom of this file. Nothing else.
    3. To get product UUIDs + slugs: open the asset on platform.vntana.com and
       copy the UUID from the URL, OR pull them via the admin API
       (see _templates/README.md). Assets must be LIVE_PUBLIC for embeds to load.
    4. git add + commit + push  ->  live on try.vntana.com.
    5. Add a row to /hub/index.html.
  Styling, rendering, gate, stats, badges are all handled below — do not touch.
  ============================================================================
-->
<style>
  :root{--ink:#17202a;--muted:#667;--line:#e2e6ec;--bg:#f4f6f9;--card:#fff;--brand:#2f8a3e;--brand2:#123e1f;--red:#b4232c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}
  .top{background:var(--brand2);color:#fff;padding:14px 0;font-size:13px}
  .top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .top .tag{font-weight:800;letter-spacing:.03em}
  .top .sub{margin-left:auto;color:#c7e6cc;font-size:12px}
  .head{background:#fff;border-bottom:1px solid var(--line);padding:22px 0}
  .head .crumbs{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);font-weight:800}
  .head h1{font-size:1.5rem;font-weight:800;margin:4px 0 6px}
  .head p{color:var(--muted);max-width:760px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .stat .v{font-size:26px;font-weight:800;color:var(--brand2);margin-top:2px}
  .stat .s{font-size:12px;color:var(--muted)}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  a.btn{display:inline-block;font-size:.8rem;font-weight:700;color:#fff;background:var(--brand);text-decoration:none;padding:9px 13px;border-radius:8px}
  a.btn.ghost{background:#fff;color:var(--brand2);border:1px solid var(--line)}
  section{margin:26px 0}
  h2{font-size:1.05rem;font-weight:800;margin:0 0 4px;display:flex;align-items:center;gap:10px}
  h2 .n{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border-radius:7px;background:var(--brand);color:#fff;font-size:.78rem;font-weight:800}
  .lead{color:var(--muted);font-size:.9rem;margin:2px 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .note{background:#f7f9fb;border:1px solid var(--line);border-radius:9px;padding:11px 14px;font-size:.84rem;margin:12px 0}
  .note.ok{background:#f0f9f1;border-color:#bfe3c5}
  ul.clean{margin:6px 0 0;padding-left:20px} ul.clean li{margin:6px 0}
  .ready{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:10px}
  .rcard{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .rcard iframe{width:100%;aspect-ratio:4/3;border:0;display:block;background:#eceff3}
  .rcard .rh{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .rcard .sku{font-weight:800}
  .rcard .meta{font-size:12px;color:var(--muted)}
  table.st{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  table.st th,table.st td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.st th{background:#f0f4f8;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  table.st tr.famrow td{background:#f7f9fb;font-weight:800;color:var(--brand2)}
  .pill2{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .p-approved{background:#15663a;color:#fff}
  .p-approvedq{background:#f0a500;color:#3d2a00}
  .p-ready{background:#e6f6ec;color:#1f8a4c}
  .p-next{background:#eef4ff;color:#1f5fbf}
  .p-wait{background:#fff6e6;color:#a6620a}
  .p-none{background:#f0f2f5;color:#5b6b7a}
  .p-new{background:var(--brand);color:#fff}
  table.log{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  table.log td,table.log th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.log th{background:#f0f4f8;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  table.log td.d{white-space:nowrap;color:var(--muted);width:90px}
  ol.q{margin:6px 0 0;padding-left:22px} ol.q li{margin:9px 0} ol.q .who{font-size:12px;color:var(--muted);font-weight:700;margin-left:6px}
  /* spotlight */
  .spot{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
  .spot .img{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#dfe3e8}
  .spot .img img{display:block;width:100%}
  .spot .cap{font-size:12px;color:var(--muted);padding:7px 10px}
  .fbrow{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;margin:7px 0}
  .fbrow .t{flex:none;font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:5px}
  .t-keep{background:#d7f0e0;color:#15663a}.t-fix{background:#fde7e7;color:var(--red)}.t-note{background:#eef1f5;color:#55606e}
  .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
  .gallery a{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;text-decoration:none}
  .gallery img{display:block;width:100%;height:150px;object-fit:cover}
  .gallery .cap{font-size:11px;color:var(--muted);padding:5px 8px}
  footer{color:var(--muted);font-size:.74rem;padding:24px 0 40px;border-top:1px solid var(--line);margin-top:30px}
  @media(max-width:640px){.spot{grid-template-columns:1fr}}
  /* gate */
  #gate{position:fixed;inset:0;z-index:1000;background:var(--brand2);display:flex;align-items:center;justify-content:center;padding:24px}
  #gate .card{max-width:400px;width:100%;padding:38px 34px;text-align:center;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  #gate .tag{font-weight:800;color:var(--brand2);letter-spacing:.03em;margin-bottom:6px}
  #gate h1{font-size:20px;margin:0 0 6px}
  #gate p{font-size:13px;color:var(--muted);margin:0 0 20px}
  #gate input{width:100%;padding:14px 16px;font-size:16px;border:1px solid var(--line);border-radius:8px;outline:none;font-family:inherit}
  #gate button{margin-top:14px;width:100%;background:var(--brand2);color:#fff;border:0;padding:15px;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer}
  #gate .err{color:var(--red);font-size:13px;font-weight:600;margin-top:12px;min-height:16px}
  body.locked{overflow:hidden} body.locked .site{filter:blur(7px);pointer-events:none;user-select:none}
</style>
</head>
<body class="locked">

<div id="gate"><div class="card">
  <div class="tag" id="gateTag">CLIENT &times; VNTANA</div>
  <h1 id="gateTitle">Program Review</h1>
  <p>This page is private. Enter the password to continue.</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="off">
  <button id="unlock">Unlock</button>
  <div class="err" id="err"></div>
</div></div>

<div class="site">
  <div class="top"><div class="wrap"><span class="tag" id="topTag"></span><span id="topSub2"></span><span class="sub" id="updated"></span></div></div>
  <div class="head"><div class="wrap">
    <div class="crumbs" id="crumbs"></div>
    <h1 id="pageTitle"></h1>
    <p id="pageIntro"></p>
    <div class="stats" id="stats"></div>
    <div class="links" id="links"></div>
  </div></div>
  <div class="wrap" id="sections"></div>
  <footer id="footer"></footer>
</div>

<script>
/* ===== RENDER ENGINE — do not edit. Scroll down to CONFIG. ===== */
(function(){
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function el(id){return document.getElementById(id);}
  window.renderCockpit=function(C){
    // brand + text
    var r=document.documentElement.style;
    if(C.brand){ if(C.brand.brand)r.setProperty('--brand',C.brand.brand); if(C.brand.brand2)r.setProperty('--brand2',C.brand.brand2); }
    var cx=esc(C.client)+" &times; "+esc(C.partner||"VNTANA");
    el('gateTag').innerHTML=cx; el('topTag').innerHTML=cx; el('gateTitle').textContent=C.subtitle||"Program Review";
    el('topSub2').textContent=C.subtitle||""; el('updated').textContent=C.updated?("Updated "+C.updated):"";
    el('crumbs').textContent=C.crumbs||""; el('pageTitle').textContent=C.title||"Where we are"; el('pageIntro').textContent=C.intro||"";
    document.title=esc(C.client)+" Program Cockpit";
    // links
    el('links').innerHTML=(C.links||[]).map(function(l){return '<a class="btn'+(l.ghost?' ghost':'')+'" href="'+esc(l.href)+'" target="_blank" rel="noopener">'+esc(l.label)+' &#8599;</a>';}).join("");
    // status maps
    var BUILT=C.built||{}, APPROVED=C.approved||{}, AQ=C.approvedPending||{}, NEWSET=C.newset||{}, ETA=C.eta||{}, FAM=C.famStatus||{};
    var LBL=Object.assign({approved:["p-approved","Approved"],ready:["p-ready","Ready for review"],next:["p-next","Next up"],wait:["p-wait","Waiting"],mat:["p-wait","Waiting on material"],none:["p-none","Not started"]}, C.statusLabels||{});
    var org=(C.platform&&C.platform.orgSlug)||"", ws=(C.platform&&C.platform.workspaceSlug)||"";
    var EMBED=function(u){return "https://embed.vntana.com/v2?productUuid="+u+"&clientSlug="+ws+"&organizationSlug="+org;};
    var PLAT=function(u){return "https://platform.vntana.com/"+org+"/"+ws+"/products/details/"+u;};
    var counts={total:0,ready:0,approved:0,approvedq:0,next:0,wait:0,mat:0,none:0}, rows="", cards="";
    (C.families||[]).forEach(function(f){
      rows+='<tr class="famrow"><td colspan="5">'+esc(f.id)+'</td></tr>';
      (f.variants||[]).forEach(function(v){
        counts.total++; var u=BUILT[v.sku];
        var st=u?(APPROVED[v.sku]?"approved":"ready"):(FAM[f.id]||"none");
        counts[st]=(counts[st]||0)+1; if(st==="approved")counts.ready++;
        if(AQ[v.sku])counts.approvedq++;
        var l=LBL[st]||LBL.none;
        var newb=NEWSET[v.sku]?' <span class="pill2 p-new">NEW</span>':'';
        var aq=AQ[v.sku]?' <span class="pill2 p-approvedq">Approved?</span>':'';
        var eta=ETA[v.sku]?' <span style="font-size:12px;color:var(--muted)">ETA '+esc(ETA[v.sku])+'</span>':'';
        rows+='<tr><td><b>'+esc(v.sku)+'</b>'+newb+aq+'</td><td>'+esc(v.body)+'</td><td>'+esc(v.conn)+'</td><td><span class="pill2 '+l[0]+'">'+esc(l[1])+'</span>'+eta+'</td><td>'+(u?'<a href="'+PLAT(u)+'" target="_blank" rel="noopener">Open &#8599;</a>':'')+'</td></tr>';
        if(u) cards+='<div class="rcard"><iframe loading="lazy" allow="xr-spatial-tracking; fullscreen" src="'+EMBED(u)+'"></iframe><div class="rh"><div><div class="sku">'+esc(v.sku)+newb+aq+'</div><div class="meta">'+esc(v.body)+' &middot; '+esc(v.conn)+'</div></div><a class="btn ghost" href="'+PLAT(u)+'" target="_blank" rel="noopener">Platform &#8599;</a></div></div>';
      });
    });
    // stat tiles (auto: total + any status present)
    var tiles=[['total','Products in this set','']];
    if(counts.ready) tiles.push(['ready','Ready for review','on platform, renderable']);
    if(counts.approved) tiles.push(['approved','Approved by client','signed off']);
    if(counts.approvedq) tiles.push(['approvedq','Approved?','to confirm in review']);
    if(counts.next) tiles.push(['next',LBL.next[1],'in production']);
    if(counts.wait) tiles.push(['wait',LBL.wait[1],'']);
    if(counts.mat) tiles.push(['mat',LBL.mat[1],'']);
    el('stats').innerHTML=tiles.map(function(t){return '<div class="stat"><div class="k">'+esc(t[1])+'</div><div class="v">'+counts[t[0]]+'</div><div class="s">'+esc(t[2])+'</div></div>';}).join("");

    // build sections
    var n=0, H="";
    function sec(title,inner,num){ n=(num===false)?n:n+1; return '<section><h2>'+(num===false?'':'<span class="n">'+n+'</span>')+esc(title)+'</h2>'+inner+'</section>'; }

    // 1 Ready for review (+ check-in + ready embeds)
    var s1="";
    s1+='<p class="lead">'+esc(C.readyLead||"These products are built, on your platform, and can be rendered. Spin them below, or open them on the platform to leave notes.")+'</p>';
    if(C.checkin){ s1+='<div class="note ok"><b>'+esc(C.checkin.title||"Is what you have working?")+'</b><ul class="clean">'+(C.checkin.questions||[]).map(function(q){return '<li>'+esc(q)+'</li>';}).join("")+'</ul></div>'; }
    s1+='<div class="ready">'+cards+'</div>';
    (C.readyNotes||[]).forEach(function(nt){ s1+='<div class="note">'+nt+'</div>'; });
    H+=sec(C.readyTitle||"Ready for your review", s1);

    // optional spotlight (e.g. a material review)
    if(C.spotlight){ var sp=C.spotlight, inner='<p class="lead">'+esc(sp.lead||"")+'</p><div class="card">';
      inner+='<div class="spot"><div class="img"><img src="'+esc(sp.image)+'" alt="">'+(sp.caption?'<div class="cap">'+esc(sp.caption)+'</div>':'')+'</div><div>';
      (sp.rows||[]).forEach(function(fr){ inner+='<div class="fbrow"><span class="t t-'+esc(fr.tag||'note')+'">'+esc((fr.tag||'note').toUpperCase())+'</span><div><b>'+esc(fr.title)+'</b> '+esc(fr.text)+'</div></div>'; });
      if(sp.ask) inner+='<div class="note" style="margin-top:8px">'+sp.ask+'</div>';
      inner+='</div></div>';
      if(sp.gallery&&sp.gallery.length){ inner+='<div class="gallery">'+sp.gallery.map(function(g){return '<a href="'+esc(g.src)+'" target="_blank" rel="noopener"><img src="'+esc(g.src)+'" alt="">'+(g.cap?'<div class="cap">'+esc(g.cap)+'</div>':'')+'</a>';}).join("")+'</div>'; }
      if(sp.footnote) inner+='<p class="lead" style="margin:10px 0 0">'+esc(sp.footnote)+'</p>';
      inner+='</div>';
      H+=sec(sp.title||"Spotlight", inner);
    }

    // 2 Status table
    var s2='<p class="lead">'+esc(C.statusLead||"")+'</p><div class="card" style="padding:8px 14px"><table class="st"><thead><tr><th>SKU</th><th>Body</th><th>Connection</th><th>Status</th><th>Platform</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    var legend=[]; if(counts.approved)legend.push('<span class="pill2 p-approved">'+esc(LBL.approved[1])+'</span> signed off');
    if(counts.approvedq)legend.push('<span class="pill2 p-approvedq">Approved?</span> confirming in review');
    legend.push('<span class="pill2 p-ready">'+esc(LBL.ready[1])+'</span> on platform');
    if(counts.next)legend.push('<span class="pill2 p-next">'+esc(LBL.next[1])+'</span> in production');
    if(counts.wait)legend.push('<span class="pill2 p-wait">'+esc(LBL.wait[1])+'</span>');
    if(counts.mat)legend.push('<span class="pill2 p-wait">'+esc(LBL.mat[1])+'</span>');
    s2+='<p style="font-size:13px;color:var(--muted);margin-top:8px">'+legend.join(' &nbsp; ')+'</p>';
    if(C.statusNote) s2+='<div class="note">'+C.statusNote+'</div>';
    H+=sec(C.statusTitle||("Status of all "+counts.total+" products"), s2);

    // 3 Received
    if(C.received&&C.received.length){ var t='<div class="card" style="padding:8px 14px"><table class="log"><thead><tr><th>Date</th><th>Item</th><th>Used for</th></tr></thead><tbody>'+C.received.map(function(x){return '<tr><td class="d">'+esc(x.date)+'</td><td>'+esc(x.item)+'</td><td>'+esc(x.use||"")+'</td></tr>';}).join("")+'</tbody></table></div>'; H+=sec(C.receivedTitle||("What we have received from "+C.client), t); }
    // 4 Decisions
    if(C.decisions&&C.decisions.length){ var t2='<div class="card" style="padding:8px 14px"><table class="log"><thead><tr><th>Date</th><th>Decision</th></tr></thead><tbody>'+C.decisions.map(function(x){return '<tr><td class="d">'+esc(x.date)+'</td><td>'+(x.text)+'</td></tr>';}).join("")+'</tbody></table></div>'; H+=sec("Decisions so far", t2); }
    // 5 Open questions
    if(C.questions&&C.questions.length){ var t3='<div class="card"><ol class="q">'+C.questions.map(function(x){return '<li>'+(x.text)+(x.who?'<span class="who">'+esc(x.who)+'</span>':'')+'</li>';}).join("")+'</ol></div>'; H+=sec(C.questionsTitle||"Open questions", t3); }
    // 6 Next steps
    if(C.nextSteps&&C.nextSteps.length){ var t4='<div class="card"><ul class="clean">'+C.nextSteps.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul></div>'; H+=sec("Next steps", t4); }

    el('sections').innerHTML=H;
    el('footer').textContent=C.footer||(C.client+" × "+(C.partner||"VNTANA")+" · program review");

    // gate
    var PW=(C.gate&&C.gate.password)||"", KEY="cockpit_"+(C.gate&&C.gate.key||(C.client||"x").toLowerCase().replace(/\W+/g,""));
    function unlock(){try{sessionStorage.setItem(KEY,'1');}catch(e){}el('gate').style.display='none';document.body.classList.remove('locked');}
    try{if(sessionStorage.getItem(KEY)==='1')unlock();}catch(e){}
    function tryPw(){var v=(el('pw').value||"").trim().toLowerCase();if(v===PW.toLowerCase()){unlock();}else{el('err').textContent='Incorrect password. Please try again.';}}
    el('unlock').addEventListener('click',tryPw);
    el('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryPw();});
  };
})();
</script>

<script>
/* ============================================================================
   CONFIG  —  EDIT EVERYTHING BELOW FOR A NEW CLIENT. This is the only part.
   (This sample renders a tiny 2-product demo so you can see it working.)
   ============================================================================ */
renderCockpit({
  client: "Sample Client",
  partner: "VNTANA",
  crumbs: "3D assets and Advanced Renders",
  title: "Where we are",
  subtitle: "Weekly review",
  updated: "Oct 23, 2026",
  intro: "What we have received, what is built and live on your platform, the decisions made so far, and the open questions for this week.",
  brand: { brand:"#2f8a3e", brand2:"#123e1f" },         // header + accent colors
  gate: { password:"sample2026", key:"sample" },         // soft password gate
  platform: { orgSlug:"taco", workspaceSlug:"products" },// for embeds + platform links

  links: [
    { label:"Your assets on VNTANA", href:"https://platform.vntana.com/taco/products/products" },
    { label:"Advanced Renders", href:"https://cycles.vntana.com" },
    { label:"Reference guide (PDF)", href:"#", ghost:true }
  ],

  // Section 1: the check-in questions shown above the live embeds
  checkin: { title:"Is what you have working?", questions:[
    "Have you been able to put the current models into your pages and tools, and how are they performing?",
    "Do the materials read right to your eye on screen?",
    "Anything failing, slow, or looking off that we should fix first?"
  ] },
  readyNotes: [ "<b>Placeholders:</b> faceplate art is a placeholder until final art arrives." ],

  // Products. Any SKU in `built` renders a live embed + 'Ready'. `approved` -> Approved pile.
  // `newset` -> NEW badge. `eta` -> date on the status pill. `famStatus` -> status for un-built families.
  families: [
    { id:"Family A", variants:[
      { sku:"A-001", body:"Cast iron", conn:"Flanged" },
      { sku:"A-002", body:"304 Stainless", conn:"Flanged" }
    ] },
    { id:"Family B", variants:[
      { sku:"B-001", body:"Bronze", conn:"NPT" }
    ] }
  ],
  built:    { "A-001":"dd44df80-5f24-42d4-827b-729e8d89b101", "A-002":"f7e86c19-ef61-47cd-a3ec-76d690d10fd0" },
  approved: { },                 // solid Approved pile (locked / confirmed sign-off)
  approvedPending: { "A-002":1 },// amber "Approved?" badge (marked, confirm in the meeting)
  newset:   { "A-001":1 },
  eta:      { "B-001":"Oct 28" },
  famStatus:{ "Family B":"next" },
  // Optional: override pill labels, e.g. statusLabels:{ mat:["p-wait","After bronze sign-off"] }

  statusNote: "<b>A note on statuses:</b> marking an asset <b>Approved</b> is fine. Normally Approved is the step just before Live Public, and this page only shows Live Public assets — so an asset flipped to Approved drops off here. Leave them Live Public while we review.",

  // Optional spotlight block (material review, hero asset, etc). Delete if unused.
  spotlight: {
    title:"Material review",
    lead:"A material-only test so we agree the look before applying it to the assets.",
    image:"../assets/taco/bronze_swatch.png?v=2",
    caption:"Swatch, neutral studio lighting.",
    rows:[
      { tag:"keep", title:"Cast surface.", text:"The matte, grainy texture matches the real body well." },
      { tag:"fix",  title:"Color.", text:"Reads dark; the real part is a warmer, lighter tone. Warm it up." },
      { tag:"note", title:"Two finish zones.", text:"Cast body is matte; machined parts are more polished." }
    ],
