server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Everything is also reachable under /custom/ (the demos live here).
    # The rewrite strips the prefix and re-resolves against root, so a page's
    # relative assets (assets/, renders/, vendor/, style.css) resolve correctly.
    location = /custom  { return 302 /custom/demos; }
    location = /custom/ { return 302 /custom/demos; }
    location /custom/ { rewrite ^/custom/(.+)$ /$1 last; }

    location / {
        # clean paths: /imts serves imts.html (both /imts and /imts.html work)
        try_files $uri $uri.html $uri/ /index.html;
    }
}
