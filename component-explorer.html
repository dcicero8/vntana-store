<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skid Steer — Component Explorer</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="vendor/viewer-test/styles/viewer.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#00548f; --blue-dark:#003a63; --sky:#3fa9f5; --accent:#00548f;
    --ink:#1a1f2b; --muted:#5c6473; --line:#e5e8ef; --bg:#f4f6f9; --card:#fff;
    --font:'Roboto',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}

  header.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
    padding:0 22px;gap:14px;position:sticky;top:0;z-index:20}
  header.top .wm{font-weight:900;letter-spacing:-.01em;font-size:1.05rem;color:var(--blue-dark)}
  header.top .wm span{color:var(--accent)}
  header.top .sub{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  main{display:grid;grid-template-columns:1fr 440px;height:calc(100vh - 56px)}
  @media(max-width:900px){main{grid-template-columns:1fr;height:auto}}

  /* viewer */
  .stage{position:relative;background:radial-gradient(circle at 50% 42%,#fff 0%,#eef1f6 78%);min-height:420px}
  vntana-viewer{width:100%;height:100%;display:block}
  .stage .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:.78rem;color:#8b93a4;pointer-events:none}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa2b2;font-size:.9rem;text-align:center;padding:0 30px;background:rgba(244,246,249,.6);backdrop-filter:blur(1px)}
  .loading.hidden{display:none}

  /* panel */
  .panel{background:var(--card);border-left:1px solid var(--line);overflow-y:auto;padding:26px 26px 40px}
  .eyebrow{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-weight:700}
  .panel h1{font-size:1.6rem;font-weight:900;margin:6px 0 2px;letter-spacing:-.02em}
  .machine{font-size:.85rem;color:var(--muted);margin-bottom:20px}

  .back{display:none;align-items:center;gap:6px;background:none;border:0;color:var(--blue);font-weight:700;font-size:.82rem;
    cursor:pointer;padding:0;margin-bottom:14px;font-family:inherit}
  .back:hover{color:var(--blue-dark);text-decoration:underline}
  .back.show{display:inline-flex}

  .chips{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
  .chip{width:100%;text-align:center;border:1px solid var(--line);background:#f7f9fc;border-radius:8px;padding:11px 13px;font-size:.82rem;font-weight:600;
    color:#40485a;cursor:pointer;transition:.15s;line-height:1.15}
  .chip:hover{border-color:var(--sky);color:var(--blue)}
  .chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .chip .ph{display:block;font-size:.62rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-top:2px}

  .detail{border:1px solid var(--line);border-radius:14px;padding:22px;background:#fbfcfe}
  .detail h2{font-size:1.2rem;font-weight:900;color:var(--blue-dark);margin:0 0 4px}
  .detail .tag{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:14px}
  .detail ul{margin:0;padding-left:18px}
  .detail li{font-size:.9rem;color:#3a4252;margin-bottom:8px;line-height:1.45}
  .detail .note{margin-top:14px;font-size:.78rem;color:#8b93a4;font-style:italic;border-top:1px dashed var(--line);padding-top:12px}
  .empty{color:#9aa2b2;font-size:.92rem;line-height:1.5}
</style>
</head>
<body>

<header class="top">
  <div class="wm">Component <span>Explorer</span></div>
  <div class="sub">Skid Steer · Wheeled Loader</div>
</header>

<main>
  <div class="stage">
    <div class="loading" id="loading">Loading interactive 3D…</div>
    <vntana-viewer id="viewer" picking="true"></vntana-viewer>
    <div class="hint">Select a component from the list to view it in 3D.</div>
  </div>

  <div class="panel">
    <button class="back" id="back">&larr; Back to full machine</button>
    <div class="eyebrow" id="eyebrow">Explore the components</div>
    <h1 id="title">Skid Steer</h1>
    <div class="machine" id="subtitle">Select a component below to inspect it in interactive 3D.</div>

    <div class="chips" id="chips"></div>

    <div class="detail" id="detail">
      <div class="empty">Select a component above to see its details and load it in 3D.</div>
    </div>
  </div>
</main>

<script type="module" src="vendor/viewer-test/dist/index.js"></script>
<script type="module">
  const viewer   = document.getElementById("viewer");
  const chipsEl  = document.getElementById("chips");
  const detail   = document.getElementById("detail");
  const loading  = document.getElementById("loading");
  const backBtn  = document.getElementById("back");
  const titleEl  = document.getElementById("title");
  const subEl    = document.getElementById("subtitle");
  const eyebrowEl= document.getElementById("eyebrow");

  const BASE="https://api.vntana.com", ORG="DCicero", WS="tradeshows";

  /* ============================================================
     HERO = the full machine shown on load.
     PARTS = the standalone component models (product switcher).
     Each entry is its own VNTANA product; clicking swaps the viewer.
     ============================================================ */
  const HERO = {
    uuid:"905b41b6-4660-4564-85ac-2c86fc68183b",
    name:"Skid Steer", tag:"Full machine",
    subtitle:"Select a component below to inspect it in interactive 3D."
  };

  const PARTS = [
    {
      id:"joystick", uuid:"b108d9f3-236b-4b55-836c-8c51b4315deb",
      name:"Control Joystick", tag:"Operator control",
      bullets:[
        "Multi-axis grip for precise proportional control",
        "Programmable buttons and rockers for machine functions",
        "CAN bus output integrates with the machine controller",
        "Sealed, durable design for harsh mobile environments"
      ],
      note:"The operator's primary interface for drive and implement control."
    },
    {
      id:"crankshaft", uuid:"ca4cc763-b2b3-4312-a7a7-8d88af79a29f",
      name:"Crankshaft & Pistons", tag:"Powertrain",
      bullets:[
        "Forged crankshaft with balanced counterweights",
        "Piston and connecting-rod assembly",
        "Converts combustion force into rotary output",
        "Core rotating assembly of the engine"
      ],
      note:"The heart of the powertrain that drives the hydraulics."
    },
    {
      id:"gearmotor", uuid:"dc659986-a854-4e3c-98ff-26db366abe21",
      name:"Gear Motor", tag:"Drive",
      bullets:[
        "Compact geared reduction for high torque output",
        "Sealed housing rated for mobile duty",
        "Direct integration with the hydraulic drive circuit",
        "Efficient low-speed, high-torque performance"
      ],
      note:"Delivers the torque that moves and steers the machine."
    },
    {
      id:"actuator", uuid:"bd46dc5c-2138-4abb-bc79-31ec4da6a7d6",
      name:"Cylinder Linear Actuator", tag:"Hydraulics",
      bullets:[
        "Hydraulic cylinder converting fluid pressure to linear force",
        "Hardened rod with wiper and rod seals",
        "Drives lift-arm and bucket / attachment motion",
        "Rated for high-cycle, high-load field service"
      ],
      note:"The muscle behind the loader arms and attachments."
    },
    {
      id:"display", uuid:"1c6703f1-bb65-4a6a-b9a7-ee05ac0dbcb0",
      name:"Dash Display", tag:"Digital integration",
      bullets:[
        "Operator instrument cluster and machine status display",
        "Sunlight-readable panel for outdoor visibility",
        "Shows diagnostics, gauges, and camera feeds",
        "Connects to the machine bus for live telemetry"
      ],
      note:"The digital dashboard tying the machine's systems together."
    }
  ];

  const byId = Object.fromEntries(PARTS.map(p => [p.id, p]));
  let activeId = null;   // null = hero

  // ── model loader (swaps viewer.src to a product) ──────────────
  const loadModel = async (uuid) => {
    loading.textContent = "Loading interactive 3D…";
    loading.classList.remove("hidden");
    try {
      const p = await fetch(`${BASE}/products/${uuid}/organizations/${ORG}/clients/${WS}`).then(r=>r.json());
      const { asset, viewerSettings } = p.response;
      const blobId = asset.models.find(m => (m.conversionFormat ?? m.type) === "GLB")?.modelBlobId
                   || asset.models[0].modelBlobId;
      // apply the product's saved framing (camera / lighting) once it loads
      if (viewerSettings?.config) {
        try { const cfg = JSON.parse(viewerSettings.config);
              viewer.addEventListener("load", () => Object.assign(viewer, cfg), { once:true }); } catch(_){}
      }
      viewer.addEventListener("load", () => loading.classList.add("hidden"), { once:true });
      viewer.src = `${BASE}/assets/products/${uuid}/organizations/${ORG}/clients/${WS}/${blobId}`;
    } catch (err) {
      loading.textContent = "Could not load the model.";
      console.error(err);
    }
  };

  // ── chips ─────────────────────────────────────────────────────
  const renderChips = () => {
    chipsEl.innerHTML = "";
    PARTS.forEach(p => {
      const b = document.createElement("button");
      b.className = "chip"; b.dataset.id = p.id;
      b.innerHTML = `${p.name}<span class="ph">${p.tag}</span>`;
      b.addEventListener("click", () => selectPart(p.id));
      chipsEl.appendChild(b);
    });
  };

  const renderCard = (p) => {
    detail.innerHTML = `
      <h2>${p.name}</h2>
      <div class="tag">${p.tag}</div>
      <ul>${p.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
      ${p.note ? `<div class="note">${p.note}</div>` : ``}`;
  };

  const selectPart = (id) => {
    const p = byId[id]; if (!p) return;
    activeId = id;
    loadModel(p.uuid);
    titleEl.textContent = p.name;
    subEl.textContent   = p.tag;
    eyebrowEl.textContent = "Component";
    renderCard(p);
    backBtn.classList.add("show");
    [...chipsEl.children].forEach(ch => ch.classList.toggle("active", ch.dataset.id === id));
  };

  const resetToHero = () => {
    activeId = null;
    loadModel(HERO.uuid);
    titleEl.textContent = HERO.name;
    subEl.textContent   = HERO.subtitle;
    eyebrowEl.textContent = "Explore the components";
    backBtn.classList.remove("show");
    [...chipsEl.children].forEach(ch => ch.classList.remove("active"));
    detail.innerHTML = `<div class="empty">Select a component above to see its details and load it in 3D.</div>`;
  };

  backBtn.addEventListener("click", resetToHero);

  // ── init ──────────────────────────────────────────────────────
  renderChips();
  loadModel(HERO.uuid);
</script>
</body>
</html>
