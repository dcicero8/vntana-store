<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>v3 configurator spike</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="vendor/viewer-v3/styles/viewer.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,Arial,sans-serif}
  #stage{position:relative;height:70vh;background:radial-gradient(circle at 50% 42%,#fff,#eef1f6)}
  vntana-viewer{width:100%;height:100%;display:block}
  #bar{padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid #e5e8ef}
  button{padding:8px 12px;border:1px solid #cdd3df;background:#fff;border-radius:6px;cursor:pointer;font:inherit}
  #log{font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;padding:8px 14px;color:#333;max-height:20vh;overflow:auto;background:#fafbfc;border-top:1px solid #e5e8ef}
</style></head>
<body>
<div id="stage"><vntana-viewer id="viewer" loading="eager" environment-src="assets/env/studio.hdr"></vntana-viewer></div>
<div id="bar">
  <b>3.0.0 spike:</b>
  <button data-tool="">bare</button>
  <button data-tool="assets/robot/tool_nozzle_v1.glb">nozzle</button>
  <button data-tool="assets/robot/tool_gripper_v1.glb">gripper</button>
  <button data-tool="assets/robot/tool_vacarm_v1.glb">vacarm</button>
  <button data-tool="assets/robot/tool_vackit_v1.glb">vackit</button>
</div>
<div id="log"></div>

<script type="module" src="vendor/viewer-v3/dist/index.js"></script>
<script type="module">
  import { $configuratorMode, $loadScene, $preload } from './vendor/viewer-v3/dist/core.js';
  const viewer = document.getElementById('viewer');
  const logEl = document.getElementById('log');
  const log = (...a) => { logEl.textContent += a.join(' ') + '\n'; };

  const ARM = 'assets/robot/robot_base_v2.glb';
  const TOOLS = {
    nozzle:  'assets/robot/tool_nozzle_v1.glb',
    gripper: 'assets/robot/tool_gripper_v1.glb',
    vacarm:  'assets/robot/tool_vacarm_v1.glb',
    vackit:  'assets/robot/tool_vackit_v1.glb',
  };

  // Resource management is the caller's job (the interface only loads). We hold the
  // currently-mounted tool's Model so we can detach AND dispose() it when swapping away —
  // otherwise its geometry/textures leak on every swap and the page eventually crashes.
  let currentTool = null;   // { model, scene } or null
  const armM_ref = { current: null };

  // Mount the tool at the arm's flange, then run the viewer's canonical single-model
  // assemble template (track every node, set scene.model, add to content, dispatch
  // 'content-change' so the viewer lights + bounds + frames it). Per the configurator README.
  const assemble = (models) => {
    const armM = models.arm; if (!armM) return false;
    const arm = armM.scene;
    const sc = viewer.scene;
    armM_ref.current = armM;

    // release the outgoing tool if it is actually changing (same URL => same Model => keep)
    const nextToolModel = models.tool || null;
    if (currentTool && currentTool.model !== nextToolModel) {
      if (currentTool.scene && currentTool.scene.parent) currentTool.scene.parent.remove(currentTool.scene);
      try { currentTool.model.dispose(); log('  disposed old tool'); } catch(e){ log('  disposeErr ' + e.message); }
      currentTool = null;
    }

    // mount the new tool
    if (nextToolModel && (!currentTool || currentTool.model !== nextToolModel)) {
      const tool = nextToolModel.scene;
      const mount = arm.getObjectByName('ToolMount') || arm;
      tool.position.set(0, 0, 0); tool.quaternion.identity(); tool.scale.set(1, 1, 1);
      mount.add(tool);
      currentTool = { model: nextToolModel, scene: tool };
    }

    arm.traverse(o => sc.trackNode(o));
    if (sc.model && sc.model !== armM) { try { sc.content.remove(sc.model.scene); } catch(_){} }
    sc.model = armM;   // the arm is the persistent base model, reused across swaps — never disposed
    if (arm.parent !== sc.content) sc.content.add(arm);
    sc.queueMeshGeometryUpdate && sc.queueMeshGeometryUpdate();
    sc.queueUpdate && sc.queueUpdate();
    sc.mixer && sc.mixer.setTime(0);
    sc.dispatchEvent({ type: 'content-change' });
    log('  assembled (' + Object.keys(models).join('+') + ') + content-change');
    return true;
  };

  viewer[$configuratorMode] = true;

  // content-change auto-frames the scene, which we want on the FIRST load but not on a tool
  // swap (a swap must keep the user's current view). Capture the camera before a swap and
  // restore it after (twice, to beat the async auto-frame).
  let firstLoad = true;
  // getters return unit-tagged objects; the setters accept those exact objects (round-trips)
  const captureCamera = () => { try { return { t: viewer.getCameraTarget(), r: viewer.getCameraRotation(), d: viewer.getCameraDistance() }; } catch(_) { return null; } };
  const restoreCamera = (cam) => { if (!cam) return; try { viewer.setCameraTarget(cam.t); viewer.setCameraRotation(cam.r); viewer.setCameraDistance(cam.d); } catch(_){} };

  async function load(tool){
    const cam = firstLoad ? null : captureCamera();
    const model = { arm: ARM };
    if (tool) model.tool = tool;
    log('--- $loadScene ' + JSON.stringify(model));
    const t0 = performance.now();
    try {
      const ok = await viewer[$loadScene]({ model }, assemble);
      if (cam) {
        // the auto-frame from content-change is async; restore over a short window to win
        restoreCamera(cam);
        requestAnimationFrame(() => restoreCamera(cam));
        setTimeout(() => restoreCamera(cam), 60);
        setTimeout(() => restoreCamera(cam), 180);
      }
      firstLoad = false;
      log('resolved=' + ok + ' in ' + Math.round(performance.now()-t0) + 'ms' + (cam ? ' (camera kept)' : ' (framed)'));
    } catch(e){ log('ERROR ' + e.message); }
  }

  document.querySelectorAll('#bar button').forEach(b =>
    b.addEventListener('click', () => load(b.getAttribute('data-tool'))));

  // No bulk preload: we load a tool on demand and dispose() the previous one on swap, so
  // memory stays bounded (arm + one tool). Preloading-for-instant-swap can be layered in
  // later, but must be paired with disposal of anything not currently shown.
  load(TOOLS.nozzle);
</script>
</body></html>
